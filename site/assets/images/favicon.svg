<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Navy background with rounded corners -->
  <rect width="64" height="64" rx="10" fill="#0B1526"/>

  <!-- Globe -->
  <circle cx="32" cy="36" r="17" fill="none" stroke="#C9A84C" stroke-width="1.8"/>
  <!-- Equator -->
  <line x1="15" y1="36" x2="49" y2="36" stroke="#C9A84C" stroke-width="1.2" opacity="0.5"/>
  <!-- Vertical meridian -->
  <ellipse cx="32" cy="36" rx="8.5" ry="17" fill="none" stroke="#C9A84C" stroke-width="1.2" opacity="0.5"/>
  <!-- Upper latitude -->
  <path d="M18 27 Q32 22 46 27" fill="none" stroke="#C9A84C" stroke-width="1" opacity="0.4"/>
  <!-- Lower latitude -->
  <path d="M18 45 Q32 50 46 45" fill="none" stroke="#C9A84C" stroke-width="1" opacity="0.4"/>

  <!-- Airplane (top-right, angled) -->
  <g transform="translate(38, 14) rotate(40)">
    <!-- Fuselage -->
    <rect x="-1.5" y="-9" width="3" height="18" rx="1.5" fill="#C9A84C"/>
    <!-- Wings -->
    <path d="M-1.5,-1 L-9,4 L-9,6 L-1.5,3 Z" fill="#C9A84C"/>
    <path d="M1.5,-1 L9,4 L9,6 L1.5,3 Z" fill="#C9A84C"/>
    <!-- Tail -->
    <path d="M-1.5,6 L-5,10 L-5,11.5 L-1.5,9 Z" fill="#C9A84C"/>
    <path d="M1.5,6 L5,10 L5,11.5 L1.5,9 Z" fill="#C9A84C"/>
  </g>
</svg>
